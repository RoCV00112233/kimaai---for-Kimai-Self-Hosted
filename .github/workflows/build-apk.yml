name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps

      - name: Compilar Web App
        run: |
          npm run build

      - name: Sincronizar Capacitor con Android
        run: |
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: Compilar APKs con Gradle (Release sin debugger y Debug)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Subir APKs como artefactos descargables
        uses: actions/upload-artifact@v4
        with:
          name: CodeTimer-Mobile-APKs
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
