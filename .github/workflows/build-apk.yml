name: Build Test APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de APK a generar (debug para pruebas rápidas / release para APK firmado)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-apk:
    name: Compilar APK de Pruebas Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm_install_max_attempts=3
          npm_install_attempt=1
          until npm install --legacy-peer-deps --fetch-retries=5 --fetch-retry-maxtimeout=120000; do
            if [ "$npm_install_attempt" -ge "$npm_install_max_attempts" ]; then
              echo "npm install falló después de $npm_install_max_attempts intentos." >&2
              exit 1
            fi
            echo "npm install falló (intento $npm_install_attempt/$npm_install_max_attempts) -- reintentando en 10s..." >&2
            npm_install_attempt=$((npm_install_attempt + 1))
            sleep 10
          done

      - name: Compilar Web App
        run: |
          npm run build

      - name: Sincronizar Capacitor con Android
        run: |
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      # Compilación de APK Debug (para pruebas directas en teléfono sin certificados)
      - name: Compilar APK Debug con Gradle
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK Debug como artefacto
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Kimaai-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Decodificar keystore solo si se pidió release
      - name: Decodificar Keystore para Release
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: El secreto KEYSTORE_BASE64 no está configurado en el repositorio." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/upload-keystore.jks
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV

      - name: Compilar APK Release con Gradle
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Subir APK Release firmado como artefacto
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Kimaai-Release-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
