name: Build Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-aab:
    name: Compilar AAB Android firmado
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps

      - name: Compilar Web App
        run: |
          npm run build

      - name: Sincronizar Capacitor con Android
        run: |
          npx cap sync android

      - name: Decodificar Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/upload-keystore.jks
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV

      - name: Dar permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: Compilar AAB firmado con Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Subir AAB como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: CodeTimer-Mobile-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
