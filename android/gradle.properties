# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process (sized for R8 + Kotlin 2.2 + Java 21).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# Enable R8 Full Mode & Unified Optimized Resource Shrinking (AGP 8.13+)
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
