<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sp-brass-grad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3c27e" />
      <stop offset="25%" stop-color="#c88b44" />
      <stop offset="50%" stop-color="#8d5624" />
      <stop offset="75%" stop-color="#dfa763" />
      <stop offset="100%" stop-color="#9a5e2a" />
    </linearGradient>

    <radialGradient id="sp-dial-grad" cx="50" cy="50" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2332" />
      <stop offset="65%" stop-color="#0e141f" />
      <stop offset="100%" stop-color="#070a10" />
    </radialGradient>

    <linearGradient id="sp-copper-grad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e28c46" />
      <stop offset="50%" stop-color="#a35820" />
      <stop offset="100%" stop-color="#703610" />
    </linearGradient>

    <radialGradient id="sp-jewel-grad" cx="50" cy="50" r="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
  </defs>

  <!-- Background for app icons -->
  <rect width="100" height="100" rx="22" fill="#0b0f17" />

  <!-- Outer Steampunk Cogwheel / Gear Teeth -->
  <g fill="url(#sp-brass-grad)">
    <rect x="47" y="5" width="6" height="5" rx="1" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(30 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(60 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(90 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(120 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(150 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(180 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(210 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(240 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(270 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(300 50 50)" />
    <rect x="47" y="5" width="6" height="5" rx="1" transform="rotate(330 50 50)" />
  </g>

  <!-- Main Bezel Ring -->
  <circle cx="50" cy="50" r="41" stroke="url(#sp-brass-grad)" stroke-width="3" fill="none" />
  <circle cx="50" cy="50" r="38" stroke="#070a10" stroke-width="1" fill="none" />

  <!-- Inner Watchface Dial -->
  <circle cx="50" cy="50" r="37" fill="url(#sp-dial-grad)" stroke="#3e2916" stroke-width="1" />

  <!-- Steampunk Brass Rivets at Cardinal Positions -->
  <circle cx="50" cy="17" r="1.8" fill="#f3c27e" stroke="#5a3514" stroke-width="0.8" />
  <circle cx="50" cy="17" r="1.8" fill="#f3c27e" stroke="#5a3514" stroke-width="0.8" transform="rotate(90 50 50)" />
  <circle cx="50" cy="17" r="1.8" fill="#f3c27e" stroke="#5a3514" stroke-width="0.8" transform="rotate(180 50 50)" />
  <circle cx="50" cy="17" r="1.8" fill="#f3c27e" stroke="#5a3514" stroke-width="0.8" transform="rotate(270 50 50)" />

  <!-- Secondary Rivets at diagonal positions -->
  <circle cx="50" cy="17" r="1.2" fill="#c88b44" stroke="#40230d" stroke-width="0.6" transform="rotate(45 50 50)" />
  <circle cx="50" cy="17" r="1.2" fill="#c88b44" stroke="#40230d" stroke-width="0.6" transform="rotate(135 50 50)" />
  <circle cx="50" cy="17" r="1.2" fill="#c88b44" stroke="#40230d" stroke-width="0.6" transform="rotate(225 50 50)" />
  <circle cx="50" cy="17" r="1.2" fill="#c88b44" stroke="#40230d" stroke-width="0.6" transform="rotate(315 50 50)" />

  <!-- Minimalist Skeletal Internal Gear Work -->
  <g transform="translate(39, 38) scale(0.4)">
    <circle cx="0" cy="0" r="18" stroke="url(#sp-copper-grad)" stroke-width="2.5" fill="none" stroke-dasharray="3 2" opacity="0.6" />
    <circle cx="0" cy="0" r="10" stroke="#a35820" stroke-width="1.5" fill="none" opacity="0.5" />
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#a35820" stroke-width="1.5" opacity="0.4" />
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#a35820" stroke-width="1.5" opacity="0.4" />
  </g>

  <g transform="translate(61, 59) scale(0.33)">
    <circle cx="0" cy="0" r="22" stroke="url(#sp-brass-grad)" stroke-width="2.5" fill="none" stroke-dasharray="4 2" opacity="0.5" />
    <circle cx="0" cy="0" r="12" stroke="#8d5624" stroke-width="1.5" fill="none" opacity="0.4" />
  </g>

  <!-- Dial Hour Markers Track -->
  <circle cx="50" cy="50" r="30" stroke="#5a3e22" stroke-width="0.75" stroke-dasharray="1 7.1" fill="none" opacity="0.7" />

  <!-- Hands -->
  <!-- Hour Hand -->
  <g transform="rotate(-60 50 50)">
    <circle cx="50" cy="58" r="3" fill="#8d5624" stroke="#e0a96d" stroke-width="0.8" />
    <path d="M48.8 50 L49 33 L47 30 L50 22 L53 30 L51 33 L51.2 50 Z" fill="url(#sp-brass-grad)" stroke="#40230d" stroke-width="0.7" />
    <circle cx="50" cy="29" r="1.3" fill="#0e141f" />
  </g>

  <!-- Minute Hand -->
  <g transform="rotate(54 50 50)">
    <line x1="50" y1="50" x2="50" y2="61" stroke="#e0a96d" stroke-width="1.4" stroke-linecap="round" />
    <path d="M49 50 L49.3 22 L47.8 19 L50 12 L52.2 19 L50.7 22 L51 50 Z" fill="url(#sp-brass-grad)" stroke="#40230d" stroke-width="0.7" />
  </g>

  <!-- Center Jewel & Pinion -->
  <circle cx="50" cy="50" r="5.5" fill="url(#sp-brass-grad)" stroke="#2b1708" stroke-width="1" />
  <circle cx="50" cy="50" r="3" fill="url(#sp-jewel-grad)" stroke="#10b981" stroke-width="0.6" />
  <circle cx="49" cy="49" r="0.8" fill="#a7f3d0" />
</svg>
